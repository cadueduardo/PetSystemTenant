    apiVersion: serving.knative.dev/v1
    kind: Service
    metadata:
      name: waha-api # O nome do seu serviço existente
    spec:
      template:
        metadata:
          annotations:
            # Mantém anotações existentes ou adiciona novas se necessário
            autoscaling.knative.dev/maxScale: '100'
            run.googleapis.com/startup-cpu-boost: 'false' # Equivalente a --no-cpu-boost
        spec:
          containerConcurrency: 80
          timeoutSeconds: 300
          serviceAccountName: 768612251806-compute@developer.gserviceaccount.com
          containers:
            image: us-central1-docker.pkg.dev/petclinic-14d1f/cloud-run-source-deploy/waha-plus:latest
            ports:
            - containerPort: 3000
            env:
              - name: WAHA_DASHBOARD_USERNAME
                value: 'petfacilwahaplus2025' # <<< Seu usuário do dashboard
              - name: WAHA_DASHBOARD_PASSWORD
                value: 'wahaadmin2025@$489038901' # <<< Sua senha do dashboard (substitua se necessário)
              - name: WAHA_API_KEY # <<< Referência à chave de API no Secret Manager
                valueFrom:
                  secretKeyRef:
                    key: latest # Usa a versão mais recente do segredo
                    name: WAHA_API_KEY # Nome do segredo no Secret Manager
            resources:
              limits:
                cpu: 2000m
                memory: 2Gi
            volumeMounts:
            - name: waha-sessions-volume # <<< Montagem do volume GCS
              mountPath: /app/sessions
            startupProbe:
              timeoutSeconds: 240
              periodSeconds: 240
              failureThreshold: 1
              tcpSocket:
                port: 3000
          volumes:
          - name: waha-sessions-volume # <<< Definição do volume GCS
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: false
              volumeAttributes:
                bucketName: petfacil-waha-sessions # Nome do seu bucket GCS

                